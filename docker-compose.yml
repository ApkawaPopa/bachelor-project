services:
  db:
    image: postgres:18.1-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/src/main/resources/migrations/1.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - amina
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      message-broker:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      HIBERNATE_SHOW_SQL: ${BACKEND_SHOW_SQL}
      HIBERNATE_FORMAT_SQL: ${BACKEND_FORMAT_SQL}
      LOGGING_LEVEL: ${BACKEND_LOGGING_LEVEL}
      JWT_SECRET: ${BACKEND_JWT_SECRET}
      S3_INTERNAL_URL: https://minio-s3:9000
      S3_EXTERNAL_URL: https://${S3_ADDRESS}:${S3_SERVER_PORT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      CORS_ALLOWED_ORIGINS: ${BACKEND_CORS}
      BROKER_HOST: "message-broker"
      BROKER_PORT: "61613"
      BROKER_LOGIN: ${BROKER_LOGIN}
      BROKER_PASSCODE: ${BROKER_PASSCODE}
    networks:
      - amina
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 15s

  message-broker:
    image: rabbitmq:4.3.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_LOGIN}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSCODE}
    networks:
      - amina
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 5s
      timeout: 4s
      retries: 10

  minio-s3:
    image: quay.io/minio/aistor/minio
    ports:
      - "${S3_SERVER_PORT}:9000"
    volumes:
      - minio-data:/amina
      - ./backend/src/main/resources/minio/minio.license:/minio.license
      - ./backend/src/main/resources/minio/private.key:/certs/private.key
      - ./backend/src/main/resources/minio/public.crt:/certs/public.crt
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
    command: minio server /amina --license /minio.license --console-address ":9001" --certs-dir /certs
    networks:
      - amina
    healthcheck:
      test: [ "CMD", "curl", "-f", "-k", "-I", "https://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: quay.io/minio/aistor/mc
    networks:
      - amina
    depends_on:
      minio-s3:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
      S3_INTERNAL_URL: https://minio-s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./backend/src/main/resources/minio/init-minio.sh:/init-minio.sh
    entrypoint: [ "/bin/sh", "/init-minio.sh" ]
    restart: "no"

  frontend:
    build: ./frontend
    ports:
      - "443:3125"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - amina
    command: npm run dev
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:

networks:
  amina: